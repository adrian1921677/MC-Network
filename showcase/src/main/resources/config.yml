# NexusShowcase - die gefuehrte Tour auf dem Demo-Server.
#
# Was der Fuehrer sagt, steht nicht hier, sondern in tour_de.yml bzw. tour_en.yml.
# Diese Datei regelt nur den Ablauf.

# de oder en - bestimmt, welche tour_<sprache>.yml gelesen wird
language: de

tour:
  # Besucher werden beim Betreten des Servers automatisch abgeholt.
  # Wer das Recht nexusshowcase.skip hat (Standard: Operatoren), wird in Ruhe gelassen.
  auto-start: true
  # Sekunden, die der Besucher zwischen zwei Haltestellen unterwegs ist
  travel-seconds: 5
  # Lesetempo: So viele Ticks bleibt ein Satz je Wort stehen (20 Ticks = 1 Sekunde).
  # Kurze Saetze bleiben mindestens 'min-hold-ticks' stehen.
  ticks-per-word: 9
  min-hold-ticks: 45
  # Am Ende der Fuehrung: true = der Besucher darf sich frei bewegen,
  # false = die Fuehrung beginnt von vorne
  free-roam-at-end: true

guide:
  # Das Minecraft-Konto, dessen Haut der Fuehrer traegt.
  # Wird beim Start einmal bei Mojang nachgeschlagen; klappt das nicht, bleibt er ohne Haut.
  skin: c4llmeadrian
  # So wird er im Chat und ueber dem Kopf genannt
  name: "Adrian"

world:
  # Diese Welt legt das Plugin selbst an (leere Void-Welt). Sie darf ruhig geloescht werden,
  # sie wird beim naechsten Start neu gebaut.
  name: nexus_showcase
  # Abstand zwischen zwei Haltestellen in Bloecken
  spacing: 60
  # Hoehe der Plattformen
  height: 70

# Der Knopf am Ende der Fuehrung
buy:
  url: "https://discord.gg/"
  label: "Jetzt kaufen"

# ===========================================
#  NexusCosmetics - Cosmetics
# ===========================================
# Jedes Cosmetic hat eine eindeutige ID (z. B. "crown"). Mögliche Einstellungen:
#
#   enabled: true/false         Cosmetic an- oder ausschalten
#   name: "<gold>Krone"         Anzeigename (MiniMessage-Farben)
#   slot: HEAD | BACK | PET     Kopf, Rücken oder Haustier
#   type: ...                   Besonderes Verhalten:
#                                 HEAD: NONE (normaler Hut), TALKING (sprechender Hut), HALO (schwebend)
#                                 BACK: NONE (Cape), ROBE (langer Umhang), WINGS (Flügel), BACKPACK (Rucksack, Jetpack ...)
#                                 PET:  GHOST, DRAGON, PENGUIN, KITTEN, BEE, MUSHROOM, OWL, ROLLER
#   glowing: true/false         Leuchtet im Dunkeln (Capes, Haustiere, Heiligenschein)
#   unlocked-by-default: true   Jeder Spieler darf es benutzen. Sonst braucht man die Permission
#                               nexuscosmetics.cosmetic.<id> (z. B. für Ränge oder Shop-Käufe).
#   rarity: COMMON          Seltenheit: COMMON, RARE, EPIC, LEGENDARY, ULTRA (für Truhen)
#   scale: 1.5              Größe (Capes, Flügel, Haustiere, Heiligenschein)
#   particle: FLAME         Partikel-Aura, z. B. FLAME, END_ROD, HEART, CHERRY_LEAVES, SOUL_FIRE_FLAME
#   model: "nexus:crown"        Optional: eigenes Modell aus dem Resource Pack
#
# EIGENE COSMETICS: Lege dein Modell in plugins/NexusCosmetics/pack/ ab (gleiche Ordnerstruktur wie
# ein Resource Pack, z. B. pack/assets/meinserver/items/cooler_hut.json) und trage es hier ein:
#
#   cooler_hut:
#     name: "<aqua>Cooler Hut"
#     slot: HEAD
#     model: "meinserver:cooler_hut"
#
# Capes brauchen drei Teil-Modelle mit Endung _0, _1, _2 (oben, Mitte, unten).
# Haustiere brauchen die Teil-Modelle ihres Typs (siehe Beispiele im eingebauten Pack).


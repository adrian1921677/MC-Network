# ===========================================
#  NexusCosmetics - Cosmetics
# ===========================================
# Every cosmetic has a unique ID (e.g. "crown"). Possible settings:
#
#   enabled: true/false         Turn the cosmetic on or off
#   name: "<gold>Crown"         Display name (MiniMessage colors)
#   slot: HEAD | BACK | PET     Head, back or pet
#   type: ...                   Special behaviour:
#                                 HEAD: NONE (normal hat), TALKING (talking hat), HALO (floating)
#                                 BACK: NONE (cape), ROBE (long robe), WINGS (wings), BACKPACK (backpack, jetpack ...)
#                                 PET:  GHOST, DRAGON, PENGUIN, KITTEN, BEE, MUSHROOM, OWL, ROLLER
#   glowing: true/false         Glows in the dark (capes, pets, halo)
#   unlocked-by-default: true   Every player may use it. Otherwise the permission
#                               nexuscosmetics.cosmetic.<id> is required (e.g. for ranks or store purchases).
#   rarity: COMMON          Rarity: COMMON, RARE, EPIC, LEGENDARY, ULTRA (for crates)
#   scale: 1.5              Size (capes, wings, pets, halo)
#   particle: FLAME         Particle aura, e.g. FLAME, END_ROD, HEART, CHERRY_LEAVES, SOUL_FIRE_FLAME
#   model: "nexus:crown"        Optional: custom model from the resource pack
#
# CUSTOM COSMETICS: Put your model into plugins/NexusCosmetics/pack/ (same folder structure as a
# resource pack, e.g. pack/assets/myserver/items/cool_hat.json) and add it here:
#
#   cool_hat:
#     name: "<aqua>Cool Hat"
#     slot: HEAD
#     model: "myserver:cool_hat"
#
# Capes need three part models ending in _0, _1, _2 (top, middle, bottom).
# Pets need the part models of their type (see the examples in the built-in pack).


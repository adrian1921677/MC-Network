# ===========================================
#  NexusCosmetics - Emotes
# ===========================================
#   enabled: true/false     Turn the emote on or off
#   name: "<red>Heart"      Display name
#   type: ...               Emojis: HEART, LAUGH, ANGRY, WOW, THUMBS, SLEEPY, PARTY
#                           Poses:  SIT, LIE, SPIN, WAVE, CLAP, DANCE
#   free: true              Everyone may use it. Otherwise nexuscosmetics.emote.<id> is required
#   model: "nexus:emoji_heart"   Optional (emojis only): custom emoji model. The animation comes from the type.

emotes:
  heart:
    enabled: true
    name: "<red>Heart"
    type: HEART
    free: true
  laugh:
    enabled: true
    name: "<yellow>Laugh"
    type: LAUGH
    free: true
  angry:
    enabled: true
    name: "<#FF5533>Angry"
    type: ANGRY
    free: true
  wow:
    enabled: true
    name: "<yellow>Wow"
    type: WOW
    free: true
  thumbs:
    enabled: true
    name: "<yellow>Thumbs Up"
    type: THUMBS
    free: true
  sleepy:
    enabled: true
    name: "<aqua>Sleepy"
    type: SLEEPY
    free: true
  party:
    enabled: true
    name: "<light_purple>Party"
    type: PARTY
    free: false
  sit:
    enabled: true
    name: "<gold>Sit"
    type: SIT
    free: true
  lie:
    enabled: true
    name: "<gold>Lie Down"
    type: LIE
    free: true
  wave:
    enabled: true
    name: "<gold>Wave"
    type: WAVE
    free: true
  clap:
    enabled: true
    name: "<gold>Clap"
    type: CLAP
    free: false
  spin:
    enabled: true
    name: "<aqua>Spin"
    type: SPIN
    free: false
  dance:
    enabled: true
    name: "<light_purple>Dance"
    type: DANCE
    free: false

# ===========================================
#  NexusCosmetics - Konfiguration / Configuration
# ===========================================
# Nach Änderungen: /cosmetics reload   (After changes: /cosmetics reload)
#
# Weitere Dateien in diesem Ordner / More files in this folder:
#   cosmetics.yml        Alle Cosmetics (an/aus, Namen, eigene Cosmetics) / all cosmetics
#   emotes.yml           Alle Emotes / all emotes
#   lang/messages_*.yml  Alle Texte / all messages
#   pack/                Eigene Modelle für das Resource Pack / your own models for the resource pack

# Sprache: "de" (Deutsch) oder "en" (English)
# Bestimmt die Texte und beim ersten Start die Namen in cosmetics.yml/emotes.yml.
language: de

resource-pack:
  # Das Plugin liefert sein Resource Pack (die 3D-Modelle) selbst an die Spieler aus.
  enabled: true

  # Adresse, unter der Spieler deinen Server erreichen (Server-IP oder Domain).
  # Zum Testen auf dem eigenen PC reicht "localhost".
  host: "localhost"

  # Port für den eingebauten Download-Server. Muss auf deinem Server freigegeben sein.
  port: 8163

  # Optional: eigener Download-Link, falls du das Pack selbst hostest.
  # Wenn hier etwas steht, werden "host" und "port" ignoriert.
  public-url: ""

  # true = Spieler werden gekickt, wenn sie das Pack ablehnen.
  required: false

  # Nachricht im Download-Dialog (MiniMessage-Format für Farben)
  prompt: "<gold>Dieses Pack wird für die 3D-Cosmetics benötigt."

# Die Schaufensterpuppe, die im Menü per Shift-Klick zeigt, wie ein Cosmetic aussieht.
#
# Für die Vorschau schliesst sich das Menü, damit die Puppe frei im Bild steht. Danach geht
# das Menü von selbst wieder auf — an derselben Stelle. Schleichen bringt sofort zurück.
# Nach dem Ändern reicht /cosmetics reload, kein Neustart nötig.
preview:
  enabled: true

  # So lange bleibt die Puppe stehen, bevor das Menü wieder aufgeht.
  seconds: 6

  # Abstand in Blöcken. Kleiner = grösser im Bild.
  distance: 2.6

  # Seitlicher Versatz in Grad. 0 = genau vor dir, positiv nach links.
  side-angle: 0

  # Höhenversatz in Blöcken. Positiv hebt die Puppe an.
  height-offset: 0.0

  # Sekunden für eine volle Drehung. 0 = die Puppe dreht sich nicht.
  turn-seconds: 9.0

storage:
  # Wo gespeichert wird, was Spieler tragen, besitzen und an Schlüsseln haben.
  #
  #   yaml  - eine Datei pro Spieler. Richtig für einen einzelnen Server.
  #   mysql - eine Datenbank für alle Server. Richtig für Netzwerke: Das Profil folgt dem
  #           Spieler von der Lobby in den Spielmodus und wieder zurück.
  #
  # Funktioniert auch mit MariaDB. Beim ersten Start mit "mysql" lädt Paper zwei kleine
  # Bibliotheken nach (Ordner "libraries") - dafür muss der Server einmal ins Internet dürfen.
  # Ist die Datenbank nicht erreichbar, startet der Server trotzdem und speichert solange lokal.
  type: yaml

  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "nexus"
    user: "nexus"
    password: ""

    # Vorsilbe der Tabelle. Mehrere Netzwerke können sich so eine Datenbank teilen.
    # Angelegt wird daraus die Tabelle "nexus_profiles".
    table-prefix: "nexus_"

    # Name dieses Servers im Netzwerk, z. B. "lobby-1" oder "bedwars-3".
    # Daran erkennt das Plugin, auf welchem Server ein Spieler gerade ist, damit das Profil
    # beim Wechsel sauber übergeben wird. Bitte auf jedem Server anders eintragen!
    server-name: ""

    # Wie viele Datenbank-Verbindungen offen gehalten werden. 6 reicht für die meisten Server.
    pool-size: 6

    # Wie oft (in Sekunden) nachgesehen wird, ob ein anderer Server etwas am Profil geändert hat
    # (z. B. ein Shop hat Schlüssel vergeben, während der Spieler in der Lobby steht).
    # 0 schaltet die Abfrage ab.
    sync-interval-seconds: 5

    # Zusätzliche Einstellungen für die Verbindung. Normalerweise unverändert lassen.
    properties:
      useSSL: false
      allowPublicKeyRetrieval: true
      characterEncoding: utf8

menu-item:
  # Ein Geschenk-Item in der Hotbar, das per Rechtsklick das Menü öffnet
  enabled: true
  # Hotbar-Platz 0 bis 8 (0 = ganz links). Ist der Platz belegt, wird nichts überschrieben.
  slot: 8
  # Nur in diesen Welten (leer = überall), z. B. [lobby, hub]
  worlds: []

emotes:
  # Wartezeit zwischen zwei Emotes in Sekunden
  cooldown-seconds: 1.5
  # Schleichen + F (Hand wechseln) öffnet das Emote-Menü
  sneak-swap-shortcut: true

talking-hat:
  # Wie lange der sprechende Hut zwischen zwei Sprüchen schweigt (Sekunden)
  min-silence-seconds: 30
  max-silence-seconds: 70

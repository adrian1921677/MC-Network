# ===========================================
#  NexusCosmetics - Messages (English)
# ===========================================
# All messages use the MiniMessage format for colors: https://docs.advntr.dev/minimessage/format
# Examples: <red>red</red>, <#FF8800>custom color</#FF8800>, <b>bold</b>, <gradient:gold:yellow>gradient</gradient>
# Placeholders like <name> or <count> are filled in by the plugin.

prefix: "<light_purple>Cosmetics » </light_purple>"
only-players: "<red>Only players can use this."
no-permission: "<red>You don't have permission to do that."
reloaded: "<green>Configuration reloaded: <white><cosmetics></white> cosmetics and <white><emotes></white> emotes."

cosmetics:
  equipped: "<gray>You are now wearing: <name>"
  unequipped-all: "<gray>All cosmetics removed."
  locked: "<red>You haven't unlocked this cosmetic yet."
  head-occupied: "<red>Take off your helmet first."
  remove-hat-first: "<red>Take off your hat first (/cosmetics)."

menu:
  main-title: "<dark_gray>Cosmetics"
  category-title: "<dark_gray><category> <gray>(<page>/<pages>)"
  categories:
    HEAD: "<gold>Hats"
    BACK: "<red>Capes"
    PET: "<green>Pets"
  category-lore: "<gray><count> cosmetics"
  open-category: "<yellow>Click to open"
  emotes-button: "<light_purple>Emotes"
  emotes-button-lore: "<gray>Tip: Sneak + F opens them anywhere"
  equipped: "<green>✔ Equipped"
  click-unequip: "<gray>Click to remove"
  click-equip: "<yellow>Click to wear"
  locked: "<red>🔒 Locked"
  unequip-all: "<red>Remove all"
  unequip-category: "<red>Remove"
  back: "<gray>« Back"
  previous-page: "<yellow>« Previous page"
  next-page: "<yellow>Next page »"

  # Search, sorting and favourites
  search: "<aqua>Search"
  search-lore: "<gray>Click, then type a term in chat"
  search-active: "<gray>Current: <white><term><gray> — click to change"
  search-prompt: "<aqua>Type your search term in chat now."
  input-cancel-hint: "<dark_gray>(type \"cancel\" to abort)"
  sort: "<aqua>Sorting"
  sort-active: "<gray>Current: <mode>"
  sort-lore: "<yellow>Click to switch"
  sort-modes:
    STANDARD: "<white>Default"
    RARITY: "<white>Rarity"
    NAME: "<white>Name (A-Z)"
    UNLOCKED: "<white>Unlocked first"
  favorites-filter: "<gold>Favourites"
  favorites-filter-on: "<green>Showing favourites only"
  favorites-filter-off: "<gray>Click: show favourites only"
  favorite-marked: "<gold>★ Favourite"
  favorite-hint: "<dark_gray>Right click: favourite"
  favorite-added: "<gold>★ <name> <gray>is now a favourite."
  favorite-removed: "<gray>★ <name> is no longer a favourite."
  reset-filters: "<red>Reset filters"
  no-results: "<red>Nothing found"
  no-results-lore: "<gray>Try another term or reset the filters"

  # Outfits
  outfits-button: "<aqua>Outfits"
  outfits-button-lore: "<gray>Saved combinations (<count>/<max>)"
  outfits-title: "<dark_gray>Outfits"
  outfits-empty: "<gray>No outfits yet"
  outfits-empty-lore: "<gray>Put something on and save it below"
  outfit-name: "<aqua><name>"
  outfit-piece: "<gray><category>: <name>"
  outfit-piece-empty: "<dark_gray>—"
  outfit-apply-hint: "<yellow>Click to wear"
  outfit-delete-hint: "<dark_gray>Right click: delete"
  outfit-save: "<green>Save current outfit"
  outfit-save-lore: "<gray>Saves what you are wearing right now"
  outfit-limit: "<red>All <max> slots are taken"
  outfit-limit-reached: "<red>You already have <max> outfits. Delete one first."
  outfit-name-prompt: "<aqua>What should the outfit be called? Type the name in chat."
  outfit-saved: "<green>Outfit <white><name><green> saved."
  outfit-deleted: "<gray>Outfit <white><name><gray> deleted."
  outfit-applied: "<green>Outfit <white><name><green> equipped (<count> pieces)."
  outfit-nothing-worn: "<red>You are not wearing anything that could be saved."
  outfit-bad-name: "<red>That name will not work. Try one without special characters."

emotes:
  menu-title: "<dark_gray>Emotes"
  click-play: "<yellow>Click to play"
  locked: "<red>You haven't unlocked this emote yet."
  locked-lore: "<red>🔒 Locked"
  unknown: "<red>Unknown emote: <name>"
  sit-ground-only: "<red>You can only sit down on the ground."
  lie-no-space: "<red>There isn't enough room to lie down here."
  tip-title: "<aqua>Tip"
  tip-lines:
    - "<gray>Sneak + F opens this menu"
    - "<gray>Moving ends poses, sneaking stands up"

menu-item:
  name: "<gradient:#FF7AD9:#FFD35A><b>✦ Cosmetics ✦</b></gradient>"
  lore:
    - "<gray>Right-click: open menu"
    - "<gray>Hats, capes, pets, emotes & crates"

rarities:
  COMMON: "<gray>Common"
  RARE: "<#4C8DFF>Rare"
  EPIC: "<#B06AFF>Epic"
  LEGENDARY: "<gold><b>Legendary</b>"
  ULTRA: "<rainbow><b>✦ ULTRA ✦</b></rainbow>"

crates:
  menu-title: "<dark_gray>Crates"
  button: "<gold>Cosmetic Crates"
  button-lore: "<gray>Open crates and win cosmetics!"
  keys: "<gray>Keys: <white><count>"
  chance-line: "<rarity><gray>: <white><percent>%"
  click-open: "<yellow>Click to open"
  no-keys-lore: "<red>No keys"
  no-keys: "<red>You don't have a key for this crate."
  all-owned: "<green>You already own everything from this crate!"
  already-opening: "<red>Wait until your crate has finished opening."
  ultra-subtitle: "<white><player> <gray>pulled <name><gray>!"
  won: "<gray>You won: <rarity> <gray>» <name>"
  broadcast: "<gold><player> <gray>pulled <rarity> <name> <gray>from a crate!"
  key-given: "<green><player> received <amount>x <crate><green>."
  key-received: "<green>You received <amount>x <crate><green>! Open it with /cosmetics."
  unlock-given: "<green><player> has unlocked <name><green>."
  unknown-crate: "<red>Unknown crate: <name>"
  unknown-reward: "<red>Unknown cosmetic or emote: <name> <gray>(emotes as emote:<id>)"
  unknown-player: "<red>Player <name> has never been on the server."
  usage-givekey: "<red>Usage: /cosmetics givekey <player> <crate> [amount]"
  usage-give: "<red>Usage: /cosmetics give <player> <cosmetic|emote:id>"

talking-hat:
  # The first time the hat is put on, it sorts the player into a team
  sorting:
    - "Hmm... who do we have here?"
    - "Tricky... I see courage, brains and a lot of hunger..."
  sorting-result: "I've got it! You belong to... <team>!"
  welcome-back: "Ah, there you are again! Proud member of <team>!"
  # Teams: the color of the name is also used for the particle fireworks
  teams:
    phoenix: "<#E8443A><b>TEAM PHOENIX"
    dragon: "<#3FB950><b>TEAM DRAGON"
    owl: "<#4C8DFF><b>TEAM OWL"
    badger: "<#F2C12E><b>TEAM BADGER"
  # Random lines in between
  lines:
    - "Hmm... I see courage. And hunger. Mostly hunger."
    - "I wasn't always a hat, you know? I used to be... a different hat."
    - "Let me guess: you're looking for diamonds. Everyone is looking for diamonds."
    - "Psst. I think that zombie over there likes you."
    - "My advice: never go to sleep in the Nether."
    - "I am a hat. I know things."
    - "Attention! Something is about to happen... or not."
    - "You have excellent taste in hats."
    - "Who invited a creeper again?"
    - "I sense great magic... oh no, that was just glowstone."
    - "Have you complimented your hat today?"
    - "Left, right, left... where are we actually going?"
